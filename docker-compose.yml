services:
  frontend_main:
    image: nginx:alpine
    container_name: frontend_main
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/main:/usr/share/nginx/html
      - ./frontend/voice:/usr/share/nginx/html/voice
    ports:
      - "35500:80"


  backend:
    container_name: backend
    build: ./backend
    restart: unless-stopped
    environment:
      - DB_PATH=/app/database/yorutomo.db
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    volumes:
      - ./database:/app/database
    ports:
      - "35501:8080"

  discord_bot:
    container_name: discord_bot
    build: ./bot
    restart: unless-stopped
    environment:
    - DB_PATH=/app/database/ShiftList.db
    - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    volumes:
      - ./database:/app/database