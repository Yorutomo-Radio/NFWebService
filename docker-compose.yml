services:
  frontend_main:
    image: nginx:alpine
    container_name: frontend_main # コンテナ名を明示
    ports:
      - "35500:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/main:/usr/share/nginx/html
      - ./frontend/voice:/usr/share/nginx/html/voice
    restart: unless-stopped

  backend:
    container_name: backend
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./database:/app/database
    environment:
      - DB_PATH=/app/database/yorutomo.db
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    ports:
      - "35501:8080"
