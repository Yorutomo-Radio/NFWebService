events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;

        # / → home/index.html にリダイレクト
        location = / {
            return 301 /home/;
        }

        # /home/ → home/index.html
        location /home/ {
            try_files $uri $uri/ /home/index.html;
        }

        # /letter/
        location /letter/ {
            try_files $uri $uri/ /letter/index.html;
        }

        # /program/
        location /program/ {
            try_files $uri $uri/ /program/index.html;
        }

        # assets・voice は直接配信
        location /assets/ {
            try_files $uri =404;
        }

        location /voice/ {
            try_files $uri =404;
        }
    }
}